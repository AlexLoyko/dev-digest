# Skill evals — content tier (evals/skills/**). Runs on OpenRouter (no subscription login in
# CI), one deterministic model so nobody has to pick one on every run.
#
# Only evaluates skills that actually changed in the PR, and only those that have evals written
# (evals/skills/<name>/) — most skills don't yet, and that's a skip (::notice::), not a failure.

name: eval-skills

on:
  pull_request:
    paths:
      - '.claude/skills/**'
      - 'evals/skills/**'
      - '.github/workflows/eval-skills.yml'

permissions:
  contents: read

concurrency:
  group: eval-skills-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: evals
    env:
      # Content tier only — direct OpenAI-compatible call, no LiteLLM proxy needed.
      EVAL_BACKEND: openrouter
      EVAL_MODEL: deepseek/deepseek-chat
      EVAL_JUDGE_MODEL: deepseek/deepseek-chat
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need base/head history to diff changed skills

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: evals/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - name: Run evals for changed skills (skip skills with no evals)
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"

          CHANGED=$( {
            git diff --name-only "$BASE" "$HEAD" -- .claude/skills/ \
              | sed -n 's#^\.claude/skills/\([^/]*\)/.*#\1#p'
            git diff --name-only "$BASE" "$HEAD" -- evals/skills/ \
              | sed -n 's#^evals/skills/\([^/]*\)/.*#\1#p'
          } | sort -u )

          if [ -z "$CHANGED" ]; then
            echo "::notice::no changed skills detected"
            exit 0
          fi

          FAIL=0
          for name in $CHANGED; do
            if [ -d "skills/$name" ]; then
              echo "::group::eval skill: $name"
              pnpm exec vitest run "skills/$name" || FAIL=1
              echo "::endgroup::"
            else
              echo "::notice::no evals for skill '$name' — skipping"
            fi
          done
          exit $FAIL
