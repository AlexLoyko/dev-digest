# Workflow-tier evals (evals/workflow/**) — the systemic check: does CLAUDE.md change what gets
# read, does a skill actually activate, does a subagent actually get dispatched. Fires on
# anything that can change that systemic behavior: any CLAUDE.md, any agent definition (an
# agent isn't just its own content — it's also what dispatches to it), the workflow cases
# themselves, or the engine (evals/src/**). Mirrors ci-detect.mjs's runWorkflow condition,
# just expressed as this job's own path filter instead of parsed output — no per-PR diffing
# needed since the trigger IS the condition here.
#
# Runs on OpenRouter through the bundled LiteLLM proxy, pinned to Gemini 2.5 Flash — per
# evals/README.md's measured comparison, it's the only cheap model that reliably drives the
# Agent tool (subagent dispatch); DeepSeek/GPT-4.1-mini do the work inline instead.

name: eval-workflow

on:
  pull_request:
    paths:
      - '**/CLAUDE.md'
      - '.claude/agents/**'
      - 'evals/workflow/**'
      - 'evals/src/**'
      - '.github/workflows/eval-workflow.yml'

permissions:
  contents: read

concurrency:
  group: eval-workflow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    runs-on: ubuntu-latest
    # Non-blocking: the `engineering-insights activation` case has failed 3/3 real runs on
    # Gemini 2.5 Flash, each time differently (asked a clarifying question; dispatched a
    # different agent instead of the expected Skill) — the exact "activation is indicative, not
    # blocking, on non-Anthropic models" caveat evals/README.md already documents. Keep the job
    # running and reporting so a real regression elsewhere in the suite is still visible, but
    # don't let this one case block merges until it's revisited.
    continue-on-error: true
    timeout-minutes: 25
    defaults:
      run:
        working-directory: evals
    env:
      EVAL_BACKEND: openrouter
      OPENROUTER_BASE_URL: http://localhost:4000
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      EVAL_MODEL: google/gemini-2.5-flash
      EVAL_JUDGE_MODEL: google/gemini-2.5-flash
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: evals/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: docker compose -f proxy/docker-compose.yml up -d

      - run: pnpm proxy:wait

      - run: pnpm eval:workflow

      - if: failure()
        run: docker compose -f proxy/docker-compose.yml logs --tail 100

      - if: always()
        run: docker compose -f proxy/docker-compose.yml down
