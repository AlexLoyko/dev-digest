<helmet>
  <style>
    body {
      margin: 0;
      background: #0a0a0a;
      color: #ededed;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 15px;
      line-height: 1.5;
      letter-spacing: -0.006em;
      -webkit-font-smoothing: antialiased;
    }
    a { color: #93bbfc; }
    a:hover { color: #3b82f6; }
    .mono {
      font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
      font-feature-settings: "calt" 1, "zero" 1;
    }
    .skel {
      background: linear-gradient(90deg, #1c1c1c 25%, #242424 50%, #1c1c1c 75%);
      background-size: 200% 100%;
      animation: ddshimmer 1.4s ease-in-out infinite;
      border-radius: 4px;
    }
    @keyframes ddshimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    .spin { animation: ddspin 1.1s linear infinite; transform-origin: 50% 50%; }
    @keyframes ddspin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .skel, .spin { animation: none; }
    }
  </style>
</helmet>
<div style="padding: 24px; background: #0a0a0a;">

  <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 14px;">

    </div>

    <div style="flex: 1; min-width: 0;">
      <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap;">
        <span style="font-size: 18px; font-weight: 700; color: #ededed;">Couldn&#39;t generate brief</span>
      </div>
      <p style="font-size: 14px; line-height: 1.55; color: #999999; margin: 8px 0 0 0;">The model returned a result that didn&#39;t match the expected shape. Nothing was stored, and no earlier brief exists for this pull request.</p>
      <div style="margin-top: 14px;">
        <button style="display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 12px; border-radius: 6px; border: 1px solid #3a3a3a; background: #242424; color: #ededed; font-size: 13px; font-weight: 600; letter-spacing: -0.006em;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path><path d="M21 3v5h-5"></path><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"></path><path d="M8 16H3v5"></path></svg>
          Try again

      </div>
    </div>

    <!-- Trailing region reserved but empty: no run data to show, and recovery is the

         later generation succeeds and the score ring appears here. -->

  </div>
</div>
