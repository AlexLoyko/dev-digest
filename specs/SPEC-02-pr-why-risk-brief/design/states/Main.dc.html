<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body {
      margin: 0;
      background: #0a0a0a;
      color: #ededed;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 15px;
      line-height: 1.5;
      letter-spacing: -0.006em;
      -webkit-font-smoothing: antialiased;
    }
    a { color: #93bbfc; }
    a:hover { color: #3b82f6; }
    .mono {
      font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
      font-feature-settings: "calt" 1, "zero" 1;
    }
    .skel {
      background: linear-gradient(90deg, #1c1c1c 25%, #242424 50%, #1c1c1c 75%);
      background-size: 200% 100%;
      animation: ddshimmer 1.4s ease-in-out infinite;
      border-radius: 4px;
    }
    @keyframes ddshimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    .spin { animation: ddspin 1.1s linear infinite; transform-origin: 50% 50%; }
    @keyframes ddspin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .skel, .spin { animation: none; }
    }
  </style>
</helmet>
<div style="padding: 24px; background: #0a0a0a;">

  <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 14px;">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6a6a6a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"></path><path d="M14 2v4a2 2 0 0 0 2 2h4"></path><path d="M16 13H8"></path><path d="M16 17H8"></path></svg>
    <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: #6a6a6a;">PR Brief</span>
  </div>

  <div style="display: flex; gap: 18px; align-items: flex-start; padding: 18px; border-radius: 10px; border: 1px solid #2a2a2a; background: #1c1c1c;">

    <div style="width: 40px; height: 40px; border-radius: 9px; display: grid; place-items: center; background: rgba(59,130,246,0.12); color: #93bbfc; flex-shrink: 0;">
      <svg class="spin" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.219-8.56"></path></svg>
    </div>

    <div style="flex: 1; min-width: 0;">
      <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap;">
        <span style="font-size: 18px; font-weight: 700; color: #ededed;">Generating brief</span>
        <span style="display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 5px; font-size: 12px; font-weight: 600; color: #999999; background: #242424; letter-spacing: 0.01em; line-height: 1.4; white-space: nowrap;">Reading intent, blast radius and diff stats</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 12px;">
        <div class="skel" style="height: 14px; width: 100%;"></div>
        <div class="skel" style="height: 14px; width: 62%;"></div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 5px; flex-shrink: 0;">
      <button aria-label="Regenerate brief" disabled style="width: 30px; height: 30px; display: inline-grid; place-items: center; border-radius: 6px; border: 1px solid transparent; background: transparent; color: #3a3a3a; cursor: not-allowed;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path><path d="M21 3v5h-5"></path><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"></path><path d="M8 16H3v5"></path></svg>
      </button>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
