<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body {
      margin: 0;
      background: #0a0a0a;
      color: #ededed;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 15px;
      line-height: 1.5;
      letter-spacing: -0.006em;
      -webkit-font-smoothing: antialiased;
    }
    a { color: #93bbfc; }
    a:hover { color: #3b82f6; }
    .mono {
      font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
      font-feature-settings: "calt" 1, "zero" 1;
    }
    .skel {
      background: linear-gradient(90deg, #1c1c1c 25%, #242424 50%, #1c1c1c 75%);
      background-size: 200% 100%;
      animation: ddshimmer 1.4s ease-in-out infinite;
      border-radius: 4px;
    }
    @keyframes ddshimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    .spin { animation: ddspin 1.1s linear infinite; transform-origin: 50% 50%; }
    @keyframes ddspin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .skel, .spin { animation: none; }
    }
  </style>
</helmet>
<div style="padding: 24px; background: #0a0a0a;">

  <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 14px;">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6a6a6a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"></path><path d="M14 2v4a2 2 0 0 0 2 2h4"></path><path d="M16 13H8"></path><path d="M16 17H8"></path></svg>
    <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: #6a6a6a;">PR Brief</span>
  </div>

  <div style="display: flex; gap: 18px; align-items: flex-start; padding: 18px; border-radius: 10px; border: 1px solid #2a2a2a; background: #1c1c1c;">

    <div style="width: 40px; height: 40px; border-radius: 9px; display: grid; place-items: center; background: rgba(107,114,128,0.12); color: #6b7280; flex-shrink: 0;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"></path><path d="M14 2v4a2 2 0 0 0 2 2h4"></path><path d="M16 13H8"></path><path d="M16 17H8"></path></svg>
    </div>

    <div style="flex: 1; min-width: 0;">
      <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap;">
        <span style="font-size: 18px; font-weight: 700; color: #ededed;">No brief yet</span>
      </div>
      <p style="font-size: 14px; line-height: 1.55; color: #999999; margin: 8px 0 0 0;">Nothing has been generated for this pull request. A brief reads the intent, blast radius, diff stats and linked issue &mdash; never the diff itself.</p>
      <div style="margin-top: 14px;">
        <button style="display: inline-flex; align-items: center; gap: 8px; justify-content: center; padding: 7px 13px; font-size: 13px; font-weight: 500; border-radius: 6px; border: 1px solid #3b82f6; background: #3b82f6; color: #fff; line-height: 1.2; letter-spacing: -0.01em; white-space: nowrap;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"></path></svg>
          Generate brief
        </button>
      </div>
    </div>

    <!-- Trailing region reserved but empty: nothing has been generated and no run
         data applies. Keeping the width stops the prose reflowing once a brief
         exists and the score ring appears here. -->
    <div aria-hidden="true" style="flex-shrink: 0; min-width: 52px;"></div>

  </div>
</div>
</x-dc>
</body>
</html>
